<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co https://cdn.jsdelivr.net; worker-src blob:; media-src blob:; style-src 'unsafe-inline'">
<style>
:root { color-scheme: light dark; font: 12px system-ui; }
body { margin: 0; background: transparent; }
button { min-height: 36px; padding: 7px 13px; margin: 0 6px 4px 0; font: inherit; border-radius: 20px; border: 0; background: #eee9ff; color: #7054ff; font-weight: 600; }
button:disabled { opacity: .5; }
audio { display: block; width: 100%; height: 34px; margin-top: 5px; }
#status { min-height: 18px; opacity: .75; } #error { color: #d53939; }
</style>
<div><button id="answer" disabled>Yanıtı tekrar dinle</button><button id="stop" disabled>Durdur</button></div>
<div id="status" role="status" aria-live="polite">Yanıt gelince otomatik seslendirilecek.</div>
<div id="error" role="alert"></div>
<audio id="audio" controls></audio>
<script type="module" src="./player.js"></script>
</html>
